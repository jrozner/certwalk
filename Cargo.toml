[package]
name = "certwalk"
version = "0.1.0"
edition = "2024"
description = "Discover domains with cert transparency"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
idna = "1.1.0"
jiff = { version = "0.2.37", default-features = false, features = ["std", "serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
